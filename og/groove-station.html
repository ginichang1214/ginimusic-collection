<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>GROOVE STATION 分享預覽圖</title>
<!-- 首頁的分享預覽圖範本（1200 × 630）：站名牌、翻牌看板、黑膠唱片、城市夜景。用 og/render.sh 產生 og-image.png -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Space+Mono:wght@700&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Noto Sans TC", sans-serif;
    color: #f2f4f8;
    background: linear-gradient(180deg, #05070f 0%, #0b1029 45%, #191a42 82%, #241b40 100%);
  }

  /* 黑膠唱片 */
  .vinyl {
    position: absolute; left: 700px; top: -110px; width: 600px; height: 600px; border-radius: 50%;
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.7);
  }
  .vinyl-disc {
    position: absolute; inset: 0; border-radius: 50%; transform: rotate(-18deg);
    background:
      radial-gradient(circle,
        transparent 0 47%, rgba(255, 255, 255, 0.06) 47% 47.6%,
        transparent 47.6% 62%, rgba(255, 255, 255, 0.06) 62% 62.6%,
        transparent 62.6% 78%, rgba(255, 255, 255, 0.06) 78% 78.6%,
        transparent 78.6% 96%, #0a0b0f 96%),
      repeating-radial-gradient(circle, #17181e 0 1.5px, #0e0f13 1.5px 3px);
    box-shadow: inset 0 0 0 2px #2a2c35;
  }
  .vinyl-label { position: absolute; left: 33%; top: 33%; width: 34%; height: 34%; }
  .vinyl-label text { fill: #14161d; font-family: "Space Mono", monospace; font-weight: 700; text-anchor: middle; }
  .vinyl-sheen {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 25deg,
      transparent 0 6%, rgba(255, 255, 255, 0.13) 11%, transparent 17% 50%,
      rgba(255, 255, 255, 0.09) 60%, transparent 67%);
    -webkit-mask: radial-gradient(circle, transparent 0 34.5%, #000 35%);
    mask: radial-gradient(circle, transparent 0 34.5%, #000 35%);
  }

  /* 城市夜景 */
  .city { position: absolute; left: 0; bottom: 0; width: 100%; height: 72%; }
  .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(transparent, rgba(14, 16, 22, 0.9)); }

  /* 文字 */
  .sign { position: absolute; left: 72px; top: 50px; width: 640px; }
  h1 {
    font-weight: 900; font-size: 126px; line-height: 0.95; letter-spacing: 0.01em; color: #fff;
    text-shadow: 0 0 28px rgba(255, 255, 255, 0.25), 0 6px 0 rgba(5, 7, 15, 0.6);
  }
  h1 span { display: block; color: #ffd23f; text-shadow: 0 0 18px rgba(255, 210, 63, 0.55), 0 0 60px rgba(255, 210, 63, 0.3), 0 6px 0 rgba(5, 7, 15, 0.6); }
  .stripe { width: 600px; height: 11px; margin-top: 18px; border-radius: 99px; background: linear-gradient(90deg, #ff6fa8 0 25%, #4fd8e6 25% 50%, #ffa36b 50% 75%, #a98bff 75%); }
  .lead { margin-top: 18px; font-size: 25px; font-weight: 500; line-height: 1.45; color: #d3d8e3; }

  /* 翻牌看板（一排） */
  .board {
    position: absolute; left: 72px; top: 482px;
    display: flex; align-items: center; gap: 20px;
    padding: 14px 20px; border-radius: 14px;
    background: #050608; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), inset 0 0 0 2px #23262f;
  }
  .flap { display: flex; gap: 4px; }
  .flap b {
    display: grid; place-items: center; width: 32px; height: 46px; border-radius: 4px;
    background: linear-gradient(#22252e 0 49%, #000 49% 51%, #1a1d24 51%);
    color: #ffd23f; font-family: "Space Mono", monospace; font-size: 27px;
  }
  .line { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 22px; }
  .line i { width: 16px; height: 16px; border-radius: 50%; background: #ff6fa8; }
  .url { position: absolute; right: 40px; bottom: 26px; font-family: "Space Mono", monospace; font-size: 16px; color: #8a91a1; }
</style>
</head>
<body>
  <div class="vinyl">
    <div class="vinyl-disc">
      <svg class="vinyl-label" viewBox="-100 -100 200 200">
        <defs>
          <path id="arc-top" d="M -72 0 A 72 72 0 0 1 72 0"/>
          <path id="arc-bottom" d="M -80 0 A 80 80 0 0 0 80 0"/>
        </defs>
        <circle r="100" fill="#ffd23f"/>
        <rect x="-100" y="-13" width="200" height="5.5" fill="#ff6fa8"/>
        <rect x="-100" y="-6.5" width="200" height="5.5" fill="#4fd8e6"/>
        <rect x="-100" y="0" width="200" height="5.5" fill="#ffa36b"/>
        <rect x="-100" y="6.5" width="200" height="5.5" fill="#a98bff"/>
        <circle r="92" fill="none" stroke="#14161d" stroke-width="1.5" opacity="0.35"/>
        <text font-size="17" letter-spacing="1"><textPath href="#arc-top" startOffset="50%">GROOVE STATION</textPath></text>
        <text font-size="10.5"><textPath href="#arc-bottom" startOffset="50%">4 LINES · SIDE A · 33⅓</textPath></text>
        <circle r="5" fill="#0e1016"/>
      </svg>
    </div>
    <div class="vinyl-sheen"></div>
  </div>

  <div id="city"></div>
  <div class="fade"></div>

  <div class="sign">
    <h1>GROOVE <span>STATION</span></h1>
    <div class="stripe"></div>
    <p class="lead">從 X、千禧到現在的 BETA 世代，不變的感動是屬於音樂、城市跟你我的律動。</p>
  </div>

  <div class="board">
    <span class="flap"><b>0</b><b>1</b></span>
    <span class="line"><i></i>東京站</span>
    <span class="flap"><b>1</b><b>9</b><b>8</b><b>4</b></span>
    <span class="flap"><b>P</b><b>L</b><b>A</b><b>S</b><b>T</b><b>I</b><b>C</b><b> </b><b>L</b><b>O</b><b>V</b><b>E</b></span>
  </div>

  <p class="url">ginichang1214.github.io/ginimusic-collection</p>

  <script>
    // 跟首頁 app.js 的 cityNightSvg() 同一套畫法（固定種子，每次產生的畫面一樣）
    function seeded(seed) {
      return () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    }
    const rand = seeded(23);
    const W = 1600, H = 640, r = (n) => n.toFixed(0);
    let back = '', front = '', wins = '', extras = '';
    for (let x = -20; x < W;) {
      const w = 50 + rand() * 90;
      const hgt = 150 + Math.pow(Math.max(x, 0) / W, 1.8) * 270 + rand() * 50;
      back += `<rect x="${r(x)}" y="${r(H - hgt)}" width="${r(w)}" height="${r(hgt)}"/>`;
      x += w + 4;
    }
    const tall = [];
    for (let x = -10; x < W;) {
      const w = 60 + rand() * 80;
      const hgt = 100 + Math.pow(Math.max(x, 0) / W, 2) * 270 + rand() * 80;
      const y = H - hgt;
      front += `<rect x="${r(x)}" y="${r(y)}" width="${r(w)}" height="${r(hgt)}"/>`;
      for (let wy = y + 14; wy < H - 12; wy += 16) {
        for (let wx = x + 10; wx < x + w - 14; wx += 13) {
          if (rand() > 0.24) continue;
          const o = (0.35 + rand() * 0.6).toFixed(2);
          if (rand() < 0.05) { rand(); rand(); } // 首頁用這幾個亂數決定窗戶怎麼閃；預覽圖不閃，但要照樣抽，畫面才會一樣
          wins += `<rect x="${r(wx)}" y="${r(wy)}" width="5" height="7" opacity="${o}"/>`;
        }
      }
      if (hgt > 300) tall.push({ x, w, y });
      x += w + 2 + rand() * 6;
    }
    for (const b of tall) extras += `<circle cx="${r(b.x + b.w / 2)}" cy="${r(b.y - 6)}" r="3.5" fill="#ff4d5e"/>`;
    const LINE_COLORS = ['#ff6fa8', '#4fd8e6', '#ffa36b', '#a98bff'];
    tall.slice(-5, -1).forEach((b, i) => {
      extras += `<rect x="${r(b.x + 8)}" y="${r(b.y + 26)}" width="14" height="70" rx="3" fill="none" stroke-width="3" stroke="${LINE_COLORS[i]}" filter="url(#glow)"/>`;
    });
    document.getElementById('city').outerHTML = `
      <svg class="city" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMaxYMax slice">
        <defs>
          <filter id="glow" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151a30"/><stop offset="1" stop-color="#0b0e1a"/></linearGradient>
        </defs>
        <g fill="#161b3b">${back}</g>
        <g fill="url(#front)">${front}</g>
        <g fill="#ffd98a">${wins}</g>
        <g>${extras}</g>
      </svg>`;
  </script>
</body>
</html>

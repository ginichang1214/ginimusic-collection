<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TOKYO NIGHTS 東京站｜GROOVE STATION</title>
  <meta name="description" content="TOKYO NIGHTS 東京站：從 1960 到 2026 的日本 City Pop 名曲，依氛圍與年代篩選，一鍵到 YouTube、Spotify、Apple Music 收聽。">
  <meta name="theme-color" content="#100f26">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:site_name" content="GROOVE STATION">
  <meta property="og:title" content="TOKYO NIGHTS 東京站">
  <meta property="og:description" content="從 1960 到 2026 的日本 City Pop 名曲，依氛圍與年代篩選，一鍵收聽。">
  <meta property="og:url" content="https://ginichang1214.github.io/ginimusic-collection/tokyo-nights/">
  <meta property="og:image" content="https://ginichang1214.github.io/ginimusic-collection/tokyo-nights/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="TOKYO NIGHTS 東京站：黃昏城市與霓虹夕陽">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%2316151f'/%3E%3Ccircle cx='50' cy='50' r='18' fill='%23ff6fa8'/%3E%3Ccircle cx='50' cy='50' r='3' fill='%2316151f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Righteous&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../station/station.css">
</head>
<body data-line="tokyo">
  <header class="hero">
    <!-- 背景和最上面的車站分頁由 ../station/station.js 畫出來 -->
    <div class="hero-art" id="hero-art" aria-hidden="true"></div>

    <div class="hero-text">
      <p class="eyebrow" lang="ja">シティポップ・コレクション</p>
      <h1>TOKYO NIGHTS<span>東京站</span></h1>
      <p class="lead">從 1960 到 2026，六十多年來日本霓虹下的都會之聲。</p>
      <p class="stats" id="stats"></p>
      <button class="btn-shuffle" id="shuffle" type="button">♫ 今晚聽哪首？</button>
    </div>
  </header>

  <!-- 本站時刻表：到站廣播、翻牌看板、下一站 -->
  <section class="timetable" id="timetable" aria-label="本站時刻表"></section>

  <nav class="controls" aria-label="篩選曲目">
    <div class="controls-inner">
      <label class="search">
        <span class="visually-hidden">搜尋</span>
        <input id="search" type="search" placeholder="搜尋歌名、歌手或專輯…" autocomplete="off">
      </label>
      <label class="sort">
        <span class="visually-hidden">排序</span>
        <select id="sort">
          <option value="year-asc">年份：舊 → 新</option>
          <option value="year-desc">年份：新 → 舊</option>
          <option value="artist">依歌手</option>
        </select>
      </label>
      <div class="filters" id="filters"></div>
    </div>
  </nav>

  <main>
    <p class="count" id="count" aria-live="polite"></p>
    <ul class="grid" id="grid"></ul>
    <p class="empty" id="empty" hidden>找不到符合的歌曲，換個關鍵字或氛圍試試？</p>
    <noscript><p class="empty">這個網站需要開啟 JavaScript 才能顯示曲目。</p></noscript>
  </main>

  <footer id="footer">
    <p>曲目資訊整理自公開資料。連結會開到各平台的歌曲或搜尋頁，本站不提供音檔。</p>
  </footer>

  <script src="../tracks.js"></script>
  <script src="../lines.js"></script>
  <script src="../common.js"></script>
  <script src="../station/station.js"></script>
  <!-- 訪客統計（GoatCounter，不用 cookie）：https://ginichang.goatcounter.com -->
  <script data-goatcounter="https://ginichang.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>

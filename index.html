<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GROOVE STATION</title>
  <meta name="description" content="GROOVE STATION：東京 City Pop、台北華語 R&B 與嘻哈、紐奧良放克與靈魂樂、亞特蘭大嘻哈 R&B，四條路線、從 1960 到 2026 的名曲，依路線、氛圍與年代篩選，一鍵到 YouTube、Spotify、Apple Music 收聽。">
  <meta name="theme-color" content="#0e1016">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:site_name" content="GROOVE STATION">
  <meta property="og:title" content="GROOVE STATION">
  <meta property="og:description" content="東京、台北、紐奧良、亞特蘭大，四條路線串起 1960 到 2026 的城市律動，一鍵收聽。">
  <meta property="og:url" content="https://ginichang1214.github.io/ginimusic-collection/">
  <meta property="og:image" content="https://ginichang1214.github.io/ginimusic-collection/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="GROOVE STATION：四條音樂路線，車站翻牌看板、黑膠唱片與城市夜景">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%2316151f'/%3E%3Ccircle cx='50' cy='50' r='18' fill='%23ffd23f'/%3E%3Ccircle cx='50' cy='50' r='3' fill='%2316151f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Righteous&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-station">
  <header class="hero hero--station" id="hero">
    <!-- 車站分頁、背景（唱片和夜景）、翻牌看板和路線圖由 app.js 畫出來；隱藏的迪斯可版是鏡球和舞池 -->
    <div class="hero-art" id="hero-art" aria-hidden="true"></div>

    <div class="hero-text">
      <p class="eyebrow">CITY POP × FUNK × SOUL × HIP HOP</p>
      <h1>GROOVE <span class="h1-b">STATION</span></h1>
      <p class="lead">從 X、千禧到現在的 BETA 世代，不變的感動是屬於音樂、城市跟你我的律動。</p>
      <div class="cta">
        <button class="btn-shuffle" id="shuffle" type="button">♫ 今晚聽哪首？</button>
      </div>
    </div>

    <div class="hero-board" id="hero-board"></div>
  </header>

  <!-- 路線導覽：每條路線一張車票，有車站小故事和代表曲 -->
  <section class="lines-guide" id="lines-guide" aria-labelledby="guide-title"></section>

  <nav class="controls" aria-label="篩選曲目">
    <div class="controls-inner">
      <label class="search">
        <span class="visually-hidden">搜尋</span>
        <input id="search" type="search" placeholder="搜尋歌名、歌手、專輯或車站…" autocomplete="off">
      </label>
      <label class="sort">
        <span class="visually-hidden">排序</span>
        <select id="sort">
          <option value="year-asc">年份：舊 → 新</option>
          <option value="year-desc">年份：新 → 舊</option>
          <option value="artist">依歌手</option>
        </select>
      </label>
      <div class="filters" id="filters"></div>
    </div>
  </nav>

  <main>
    <p class="count" id="count" aria-live="polite"></p>
    <ul class="grid" id="grid"></ul>
    <p class="empty" id="empty" hidden>找不到符合的歌曲，換個關鍵字或氛圍試試？</p>
    <noscript><p class="empty">這個網站需要開啟 JavaScript 才能顯示曲目。</p></noscript>
  </main>

  <footer id="footer">
    <p>曲目資訊整理自公開資料。連結會開到各平台的歌曲或搜尋頁，本站不提供音檔。</p>
    <p>背景音樂〈Last Train Groove 末班車〉是本站原創，由瀏覽器即時合成。</p>
  </footer>

  <script src="tracks.js"></script>
  <script src="lines.js"></script>
  <script src="common.js"></script>
  <script src="bgm.js"></script>
  <script src="app.js"></script>
</body>
</html>

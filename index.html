<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GROOVE STATION</title>
  <meta name="description" content="GROOVE STATION：從 1960 到 2026 的 City Pop 與 Funk 名曲，依曲風、氛圍與年代篩選，一鍵到 YouTube、Spotify、Apple Music 收聽。">
  <meta name="theme-color" content="#0e1016">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:site_name" content="GROOVE STATION">
  <meta property="og:title" content="GROOVE STATION">
  <meta property="og:description" content="從 1960 到 2026 的 City Pop 與 Funk 名曲，依曲風、氛圍與年代篩選，一鍵收聽。">
  <meta property="og:url" content="https://ginichang1214.github.io/citypop-collection/">
  <meta property="og:image" content="https://ginichang1214.github.io/citypop-collection/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="GROOVE STATION：City Pop × Funk，車站翻牌看板、黑膠唱片與城市夜景">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%2316151f'/%3E%3Ccircle cx='50' cy='50' r='18' fill='%23ff6fa8'/%3E%3Ccircle cx='50' cy='50' r='3' fill='%2316151f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Righteous&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-station">
  <header class="hero hero--station" id="hero">
    <!-- 裝飾（看板、背景；隱藏的迪斯可版是鏡球和舞池）由 app.js 畫出來 -->
    <div class="hero-art" id="hero-art" aria-hidden="true"></div>

    <a class="site-switch" href="tokyo-nights/">TOKYO NIGHTS東京站：City Pop</a>

    <div class="hero-text">
      <p class="eyebrow">
        <span class="eyebrow-text">CITY POP × FUNK</span>
        <span class="line-badges">
          <span class="line-badge"><i style="background:#ff6fa8">CP</i>CITY POP LINE</span>
          <span class="line-badge"><i style="background:#ffa36b">FK</i>FUNK LINE</span>
        </span>
      </p>
      <h1>GROOVE <span class="h1-b">STATION</span></h1>
      <p class="lead">從 1960 到 2026，City Pop 與 Funk 的城市律動。</p>
      <div class="cta">
        <p class="stats" id="stats"></p>
        <button class="btn-shuffle" id="shuffle" type="button">♫ 今晚聽哪首？</button>
      </div>
    </div>

    <div class="hero-board" id="hero-board"></div>
  </header>

  <nav class="controls" aria-label="篩選曲目">
    <div class="controls-inner">
      <label class="search">
        <span class="visually-hidden">搜尋</span>
        <input id="search" type="search" placeholder="搜尋歌名、歌手或專輯…" autocomplete="off">
      </label>
      <label class="sort">
        <span class="visually-hidden">排序</span>
        <select id="sort">
          <option value="year-asc">年份：舊 → 新</option>
          <option value="year-desc">年份：新 → 舊</option>
          <option value="artist">依歌手</option>
        </select>
      </label>
      <div class="filter-row">
        <span class="filter-label" id="genre-label">曲風</span>
        <div class="chips" id="genres" role="group" aria-labelledby="genre-label"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label" id="mood-label">氛圍</span>
        <div class="chips" id="moods" role="group" aria-labelledby="mood-label"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label" id="decade-label">年代</span>
        <div class="chips" id="decades" role="group" aria-labelledby="decade-label"></div>
      </div>
    </div>
  </nav>

  <main>
    <p class="count" id="count" aria-live="polite"></p>
    <ul class="grid" id="grid"></ul>
    <p class="empty" id="empty" hidden>找不到符合的歌曲，換個關鍵字或氛圍試試？</p>
    <noscript><p class="empty">這個網站需要開啟 JavaScript 才能顯示曲目。</p></noscript>
  </main>

  <footer>
    <p>曲目資訊整理自公開資料。連結會開到各平台的歌曲或搜尋頁，本站不提供音檔。</p>
    <p>只想聽日本 City Pop？看看特輯 <a href="tokyo-nights/">TOKYO NIGHTS 東京站</a>。</p>
  </footer>

  <script src="tracks.js"></script>
  <script src="app.js"></script>
</body>
</html>
